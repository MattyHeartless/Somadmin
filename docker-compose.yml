services:
  sqlserver:
    # SQL Server-compatible image for Apple Silicon development.
    # Production deployments use SQL Server 2022+.
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-ChangeThisBeforeDeploying!}"
    ports:
      - "1434:1433"
    volumes:
      - soma-sqlserver:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -x sqlservr >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  soma-sqlserver:
